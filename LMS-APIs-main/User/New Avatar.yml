info:
  name: New Avatar
  type: http
  seq: 4

http:
  method: POST
  url: http://127.0.0.1:8000/api/user/avatar
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  body:
    type: multipart-form
    data:
      - name: avatar
        type: text
        value: ""
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
