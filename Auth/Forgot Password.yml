info:
  name: Forgot Password
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/auth/password/forgot"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: ""
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
