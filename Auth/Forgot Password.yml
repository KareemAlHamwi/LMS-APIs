info:
  name: Forgot Password
  type: http
  seq: 5

http:
  method: POST
  url: http://127.0.0.1:8000/api/auth/password/forgot
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: whateverr@gmail.com
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
