info:
  name: Login
  type: http
  seq: 1

http:
  method: POST
  url: http://127.0.0.1:8000/api/auth/login
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: whatever@gmail.com
      - name: password
        type: text
        value: Admin@123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
