info:
  name: Reset Password
  type: http
  seq: 7

http:
  method: POST
  url: http://127.0.0.1:8000/api/auth/password/reset
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: ""
      - name: password
        type: text
        value: ""
      - name: password_confirmation
        type: text
        value: ""
      - name: token
        type: text
        value: ""
      - name: ""
        type: text
        value: ""
  auth:
    type: bearer
    token: ""

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
