info:
  name: Register
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  headers:
    - name: Accept
      value: application/json
    - name: Accept-Language
      value: ar
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: "Ali "
      - name: last_name
        type: text
        value: Ibrahim
      - name: email
        type: text
        value: i19077991@gmail.com
      - name: password
        type: text
        value: 123456789@Qw
      - name: password_confirmation
        type: text
        value: 123456789@Qw
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
