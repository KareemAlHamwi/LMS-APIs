info:
  name: Register
  type: http
  seq: 3

http:
  method: POST
  url: http://127.0.0.1:8000/api/auth/register
  headers:
    - name: Accept
      value: application/json
  body:
    type: multipart-form
    data:
      - name: first_name
        type: text
        value: kareem
      - name: last_name
        type: text
        value: alhamwi
      - name: email
        type: text
        value: whatever@gmail.com
      - name: password
        type: text
        value: Admin@123
      - name: password_confirmation
        type: text
        value: Admin@123
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
